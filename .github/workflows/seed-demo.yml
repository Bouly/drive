# Fill an account of the demonstration server with the Albert bank: thirty
# public documents from Légifrance and from the fiches travail-emploi, written
# as documents, spreadsheets and scans, then read by the ordinary pipeline.
#
# Run by hand from the Actions tab. It is idempotent: a document the drive
# already holds is skipped, so running it twice adds nothing.
name: Seed demo bank

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Drive account the bank belongs to"
        required: true
        default: "demo@demo.com"
      documents:
        description: "Documents per collection (two collections)"
        required: true
        default: "15"
      collection:
        description: "One Albert collection id, to top up a bank that is short of one corpus (empty: both)"
        required: false
        default: ""

concurrency:
  group: seed-demo
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    # Thirty documents are fetched, written, extracted (with OCR for the
    # scans) and embedded: minutes, not seconds.
    timeout-minutes: 45
    steps:
      - name: Check the inputs
        env:
          EMAIL: ${{ inputs.email }}
          DOCUMENTS: ${{ inputs.documents }}
          COLLECTION: ${{ inputs.collection }}
        run: |
          # All three travel into a shell on the server: they are checked here
          # rather than trusted for being ours.
          [[ "$EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] \
            || { echo "Not an email address: $EMAIL" >&2; exit 1; }
          [[ "$DOCUMENTS" =~ ^[0-9]{1,3}$ ]] \
            || { echo "Not a count: $DOCUMENTS" >&2; exit 1; }
          [[ "$COLLECTION" =~ ^[0-9]{0,9}$ ]] \
            || { echo "Not a collection id: $COLLECTION" >&2; exit 1; }

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Seed
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
          EMAIL: ${{ inputs.email }}
          DOCUMENTS: ${{ inputs.documents }}
          COLLECTION: ${{ inputs.collection }}
        run: |
          ONE=""
          if [[ -n "$COLLECTION" ]]; then
            ONE="--collection $COLLECTION"
          fi
          ssh "$PROD_HOST" "set -e
            cd '$PROD_PATH/deploy'
            docker compose -f compose.prod.yaml run --rm backend \
              python manage.py graph_seed_albert '$EMAIL' --documents '$DOCUMENTS' $ONE"
