# Thème de connexion de la démo : le Keycloak par défaut n'a rien à voir avec
# l'application, on garde son gabarit et on remplace l'habillage.
parent=keycloak.v2
import=common/keycloak

# La liste remplace celle du parent : sa feuille doit y rester. Celles de
# PatternFly arrivent par « import », inutile de les répéter.
styles=css/styles.css css/drive.css
