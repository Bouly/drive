# Entry point of DRIVE_DOMAIN behind Caddy (TLS is terminated by Caddy).

# Previews are displayed inline, other media are downloaded
# (an empty value makes add_header skip the header).
map $uri $media_disposition {
    ~^/media/preview/  "";
    default            "attachment";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    charset utf-8;
    client_max_body_size 0;

    # Resolve container names on every request through Docker's DNS: a deploy
    # recreates backend/frontend with new IPs, and a static upstream would keep
    # pointing at the old ones (502 until nginx restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $frontend http://frontend:8080;
    set $minio http://minio:9000;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
        proxy_pass $frontend;
    }

    # Static write-up of the file graph, mounted from deploy/doc. Served here
    # rather than from the frontend so a deploy never rebuilds an image to fix
    # a typo, and so search engines can reach it without an account.
    location = /doc {
        # Relative Location header: TLS is terminated by Caddy, so $scheme here
        # is http and an absolute redirect would bounce the browser to plain http.
        absolute_redirect off;
        return 301 /doc/;
    }

    location /doc/ {
        alias /usr/share/nginx/doc/;
        index index.html;
        add_header Cache-Control "public, max-age=300";
    }

    location ~ ^/(api|admin|static|external_api)/ {
        proxy_read_timeout 90s;
        proxy_pass $backend;
    }

    # With a variable in proxy_pass, nginx does not rewrite the location prefix:
    # map /media/<key> to /drive-media-storage/<key> explicitly.
    location ~ ^/media/(preview/)?(?<media_key>.*)$ {
        auth_request /media-auth;
        auth_request_set $authHeader $upstream_http_authorization;
        auth_request_set $authDate $upstream_http_x_amz_date;
        auth_request_set $authContentSha256 $upstream_http_x_amz_content_sha256;

        proxy_set_header Authorization $authHeader;
        proxy_set_header X-Amz-Date $authDate;
        proxy_set_header X-Amz-Content-SHA256 $authContentSha256;
        proxy_set_header Host minio:9000;
        proxy_pass $minio/drive-media-storage/$media_key$is_args$args;

        add_header Content-Disposition $media_disposition;
        add_header X-Robots-Tag noindex always;
    }

    location = /media-auth {
        internal;
        proxy_pass $backend/api/v1.0/items/media-auth/;
        # A location-level proxy_set_header drops the server-level ones: repeat them.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-URL $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
}
